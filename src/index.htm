        function updateFloatingQr() {

            const currentSlide =
                slides[
                currentIndex
                ];


            const shouldShow =
                currentSlide &&
                currentSlide.dataset.qrVisible ===
                "true";


            floatingApplication
                .classList
                .toggle(
                    "visible",
                    Boolean(
                        shouldShow
                    )
                );


            floatingApplication
                .setAttribute(
                    "aria-hidden",
                    shouldShow
                        ? "false"
                        : "true"
                );


            if (
                shouldShow
            ) {

                trackCtaImpression(
                    "floating_application",
                    "button"
                );


                trackCtaImpression(
                    "floating_application",
                    "qr"
                );
            }
        }


        function formatPlaybackSpeed(
            speed
        ) {

            return (
                Number.isInteger(
                    speed
                )
                    ? String(
                        speed
                    )
                    : speed.toFixed(
                        1
                    )
            ) +
                "×";
        }


        function syncPlaybackSpeedControl() {

            const minimumSpeed =
                Number(
                    playbackSpeed.min
                );


            const maximumSpeed =
                Number(
                    playbackSpeed.max
                );


            const configuredSpeed =
                Number(
                    CONFIG.playbackSpeed
                );


            const speed =
                Math.min(
                    maximumSpeed,
                    Math.max(
                        minimumSpeed,
                        Number.isFinite(
                            configuredSpeed
                        )
                            ? configuredSpeed
                            : 1
                    )
                );


            const speedProgress =
                (
                    (
                        speed -
                        minimumSpeed
                    ) /
                    (
                        maximumSpeed -
                        minimumSpeed
                    )
                ) *
                100;


            const speedLabel =
                formatPlaybackSpeed(
                    speed
                );


            CONFIG.playbackSpeed =
                speed;


            playbackSpeed.value =
                String(
                    speed
                );


            playbackSpeedValue.textContent =
                speedLabel;


            playbackSpeed.setAttribute(
                "aria-valuetext",
                speedLabel +
                " playback speed"
            );


            playbackSpeed.style.setProperty(
                "--speed-progress",
                String(
                    speedProgress
                ) +
                "%"
            );
        }


        /*
          ==========================================================
          SYLLABLE TIMING
          ==========================================================
        */


        function cleanWord(
            word
        ) {

            return word
                .toLowerCase()
                .replace(
                    /[^a-z']/g,
                    ""
                )
                .replace(
                    /^'+|'+$/g,
                    ""
                );
        }


        function countWordSyllables(
            rawWord
        ) {

            const word =
                cleanWord(
                    rawWord
                );


            if (
                !word
            ) {

                return 0;
            }


            if (
                word.length <=
                3
            ) {

                return 1;
            }


            const exceptions = {
                agency: 3,
                integrity: 4,
                direction: 3,
                control: 2,
                chaos: 2,
                pressure: 2,
                capacity: 4,
                capacities: 4,
                accountability: 6,
                brotherhood: 3,
                crucible: 3,
                community: 4,
                guidance: 2,
                reality: 4,
                behavioral: 4,
                environment: 4,
                motivation: 4,
                inconsistency: 5,
                responsibility: 6,
                contribution: 4,
                reliability: 5,
                leadership: 3,
                stewardship: 3,
                application: 4
            };


            if (
                Object.prototype.hasOwnProperty.call(
                    exceptions,
                    word
                )
            ) {

                return exceptions[
                    word
                ];
            }


            let candidate =
                word
                    .replace(
                        /(?:[^laeiouy]es|ed|[^laeiouy]e)$/i,
                        ""
                    )
                    .replace(
                        /^y/i,
                        ""
                    );


            const groups =
                candidate.match(
                    /[aeiouy]{1,2}/g
                );


            let count =
                groups
                    ? groups.length
                    : 1;


            if (
                word.endsWith(
                    "le"
                ) &&
                word.length >
                2 &&
                !/[aeiouy]/.test(
                    word.charAt(
                        word.length -
                        3
                    )
                )
            ) {

                count +=
                    1;
            }


            return Math.max(
                1,
                count
            );
        }


        function countSyllables(
            text
        ) {

            return text
                .replace(
                    /\*\*/g,
                    ""
                )
                .replace(
                    /__/g,
                    ""
                )
                .replace(
                    /~~/g,
                    ""
                )
                .replace(
                    /\*/g,
                    ""
                )
                .split(
                    /\s+/
                )
                .filter(
                    Boolean
                )
                .reduce(
                    (
                        total,
                        word
                    ) =>
                        total +
                        countWordSyllables(
                            word
                        ),
                    0
                );
        }


        function getPlainSlideText(
            slide
        ) {

            if (
                !slide
            ) {

                return "";
            }


            const narrative =
                slide.querySelector(
                    ".narrative"
                );


            if (
                narrative
            ) {

                return narrative.textContent.trim();
            }


            const headline =
                slide.querySelector(
                    ".finalQrHeadline"
                );


            if (
                headline
            ) {

                return headline.textContent.trim();
            }


            return "";
        }


        function getSlideTiming(
            slide
        ) {

            if (
                slide &&
                slide.dataset.indefinite ===
                "true"
            ) {

                return {
                    syllables:
                        countSyllables(
                            getPlainSlideText(
                                slide
                            )
                        ),

                    delay:
                        Infinity
                };
            }


            const syllables =
                countSyllables(
                    getPlainSlideText(
                        slide
                    )
                );


            const weightedDelay =
                CONFIG.baseDelayMs +
                syllables *
                CONFIG.syllableWeightMs;


            const speedAdjusted =
                weightedDelay /
                Math.max(
                    0.05,
                    CONFIG.playbackSpeed
                );


            const finalDelay =
                Math.min(
                    CONFIG.maximumDelayMs,
                    Math.max(
                        CONFIG.minimumDelayMs,
                        speedAdjusted
                    )
                );


            return {
                syllables:
                    syllables,

                delay:
                    Math.round(
                        finalDelay
                    )
            };
        }


        /*
          ==========================================================
          TEXT FITTING
          ==========================================================
        */


        function fitCurrentSlide() {

            const slide =
                slides[
                currentIndex
                ];


            if (
                !slide
            ) {

                return;
            }


            const narrative =
                slide.querySelector(
                    ".narrative"
                );


            if (
                narrative
            ) {

                narrative.style.fontSize =
                    "";


                let size =
                    parseFloat(
                        getComputedStyle(
                            narrative
                        ).fontSize
                    );


                let guard =
                    0;


                while (
                    (
                        narrative.scrollHeight >
                        slide.clientHeight ||
                        narrative.scrollWidth >
                        slide.clientWidth
                    ) &&
                    size >
                    22 &&
                    guard <
                    100
                ) {

                    size *=
                        0.96;


                    narrative.style.fontSize =
                        size +
                        "px";


                    guard +=
                        1;
                }
            }
        }


        /*
          ==========================================================
          SLIDE LOCATION
          ==========================================================
        */


        function getSlideIndexFromLocation() {

            const locationParams =
                new URLSearchParams(
                    window.location.hash.slice(
                        1
                    )
                );


            const requestedSlide =
                Number(
                    locationParams.get(
                        "slide"
                    )
                );


            if (
                !Number.isInteger(
                    requestedSlide
                ) ||
                requestedSlide <
                1
            ) {

                return 0;
            }


            return requestedSlide -
                1;
        }


        function isPresentationPausedInLocation() {

            const locationParams =
                new URLSearchParams(
                    window.location.hash.slice(
                        1
                    )
                );


            return locationParams.get(
                "paused"
            ) ===
                "1";
        }


        function updateSlideLocation() {

            const url =
                new URL(
                    window.location.href
                );


            const locationParams =
                new URLSearchParams(
                    url.hash.slice(
                        1
                    )
                );


            locationParams.set(
                "slide",
                String(
                    currentIndex +
                    1
                )
            );


            if (
                isPlaying
            ) {

                locationParams.delete(
                    "paused"
                );

            } else {

                locationParams.set(
                    "paused",
                    "1"
                );
            }


            url.hash =
                locationParams.toString();


            window.history.replaceState(
                window.history.state,
                "",
                url
            );
        }


        function syncSlideScrubber() {

            const totalSlides =
                Math.max(
                    1,
                    slides.length
                );


            const currentSlide =
                Math.min(
                    totalSlides,
                    currentIndex +
                    1
                );


            slideScrubber.max =
                String(
                    totalSlides
                );


            slideScrubber.value =
                String(
                    currentSlide
                );


            slideScrubber.disabled =
                slides.length ===
                0;


            slideScrubber.setAttribute(
                "aria-valuetext",
                "Slide " +
                String(
                    currentSlide
                ) +
                " of " +
                String(
                    totalSlides
                )
            );


            const progress =
                totalSlides ===
                    1
                    ? 0
                    : (
                        (
                            currentSlide -
                            1
                        ) /
                        (
                            totalSlides -
                            1
                        )
                    ) *
                    100;


            slideScrubber.style.setProperty(
                "--slide-progress",
                String(
                    progress
                ) +
                "%"
            );
        }


        /*
          ==========================================================
          PROGRESS
          ==========================================================
        */


        function applyProgressCurve(
            linear
        ) {

            const x =
                Math.max(
                    0,
                    Math.min(
                        1,
                        linear
                    )
                );


            const strength =
                Math.max(
                    0.001,
                    CONFIG.progressCurveStrength
                );


            return (
                Math.log(
                    1 +
                    strength *
                    x
                ) /
                Math.log(
                    1 +
                    strength
                )
            );
        }


        function setProgress(
            slideFraction =
                0
        ) {

            if (
                slides.length ===
                0
            ) {

                retentionProgress.style.width =
                    "0%";

                return;
            }


            const linear =
                Math.max(
                    0,
                    Math.min(
                        1,
                        (
                            currentIndex +
                            slideFraction
                        ) /
                        slides.length
                    )
                );


            const curved =
                applyProgressCurve(
                    linear
                );


            retentionProgress.style.width =
                (
                    curved *
                    100
                ) +
                "%";
        }


        function updateProgressFrame() {

            if (
                !isPlaying ||
                !Number.isFinite(
                    activeDelay
                )
            ) {

                return;
            }


            const elapsed =
                performance.now() -
                slideStartedAt;


            const fraction =
                Math.min(
                    1,
                    elapsed /
                    activeDelay
                );


            setProgress(
                fraction
            );


            if (
                fraction <
                1
            ) {

                progressFrame =
                    requestAnimationFrame(
                        updateProgressFrame
                    );
            }
        }


        /*
          ==========================================================
          PLAYBACK
          ==========================================================
        */


        function setPlaybackButtonState() {

            const isPaused =
                !isPlaying;


            const label =
                isPaused
                    ? "Play presentation"
                    : "Pause presentation";


            playButton.dataset.state =
                isPaused
                    ? "paused"
                    : "playing";


            playButton.setAttribute(
                "aria-label",
                label
            );


            playButton.title =
                label;
        }


        function stopPlaybackTimers() {

            if (
                slideTimer !==
                null
            ) {

                clearTimeout(
                    slideTimer
                );


                slideTimer =
                    null;
            }


            if (
                progressFrame !==
                null
            ) {

                cancelAnimationFrame(
                    progressFrame
                );


                progressFrame =
                    null;
            }
        }


        function pausePlayback(
            pauseMethod =
                "system"
        ) {

            const wasPlaying =
                isPlaying;

            isPlaying =
                false;


            setPlaybackButtonState();


            stopPlaybackTimers();


            if (
                wasPlaying
            ) {

                trackTelemetry(
                    "presentation_pause",
                    {
                        pause_method:
                            pauseMethod
                    }
                );
            }


            if (
                slides.length >
                0
            ) {

                updateSlideLocation();
            }
        }


        function scheduleCurrentSlide() {

            stopPlaybackTimers();


            const slide =
                slides[
                currentIndex
                ];


            if (
                !slide ||
                !isPlaying
            ) {

                return;
            }


            const timingData =
                getSlideTiming(
                    slide
                );


            if (
                timingData.delay ===
                Infinity
            ) {

                isPlaying =
                    false;


                setPlaybackButtonState();


                timing.textContent =
                    "Final · hold";


                retentionProgress.style.width =
                    "100%";


                updateSlideLocation();


                return;
            }


            activeDelay =
                timingData.delay;


            slideStartedAt =
                performance.now();


            timing.textContent =
                timingData.syllables +
                " syllables · " +
                timingData.delay +
                " ms";


            updateProgressFrame();


            slideTimer =
                setTimeout(
                    () => {

                        if (
                            currentIndex <
                            slides.length -
                            1
                        ) {

                            showSlide(
                                currentIndex +
                                1,
                                "automatic"
                            );

                        } else {

                            isPlaying =
                                false;


                            setPlaybackButtonState();


                            trackTelemetry(
                                "presentation_complete",
                                {
                                    completion_method:
                                        "natural"
                                }
                            );


                            updateSlideLocation();
                        }
                    },
                    activeDelay
                );
        }


        function showSlide(
            index,
            navigationMethod =
                "automatic"
        ) {

            stopPlaybackTimers();


            if (
                slides.length ===
                0
            ) {

                counter.textContent =
                    "00 / 00";


                timing.textContent =
                    "No slides";


                syncSlideScrubber();


                return;
            }


            const previousIndex =
                currentIndex;


            currentIndex =
                Math.max(
                    0,
                    Math.min(
                        index,
                        slides.length -
                        1
                    )
                );


            if (
                previousIndex !==
                currentIndex
            ) {

                trackSlideExit(
                    previousIndex,
                    navigationMethod
                );
            }


            syncSlideScrubber();


            slides.forEach(
                (
                    slide,
                    slideIndex
                ) => {

                    slide.classList.toggle(
                        "active",
                        slideIndex ===
                        currentIndex
                    );
                }
            );


            updateFloatingQr();


            counter.textContent =
                String(
                    currentIndex +
                    1
                ).padStart(
                    2,
                    "0"
                ) +
                " / " +
                String(
                    slides.length
                ).padStart(
                    2,
                    "0"
                );


            const currentSlide =
                slides[
                currentIndex
                ];


            const timingData =
                getSlideTiming(
                    currentSlide
                );


            if (
                timingData.delay ===
                Infinity
            ) {

                timing.textContent =
                    "Final · hold";

            } else {

                timing.textContent =
                    timingData.syllables +
                    " syllables · " +
                    timingData.delay +
                    " ms";
            }


            trackSlideView(
                navigationMethod,
                timingData
            );


            if (
                currentSlide.dataset.type ===
                "finalQr"
            ) {

                trackCtaImpression(
                    "final_application",
                    "button"
                );


                trackCtaImpression(
                    "final_application",
                    "qr"
                );
            }


            setProgress(
                0
            );


            requestAnimationFrame(
                () => {

                    fitCurrentSlide();
                }
            );


            if (
                currentSlide.dataset.indefinite ===
                "true"
            ) {

                if (
                    navigationMethod ===
                    "automatic"
                ) {

                    trackTelemetry(
                        "presentation_complete",
                        {
                            completion_method:
                                "final_slide"
                        }
                    );
                }


                isPlaying =
                    false;


                setPlaybackButtonState();


                retentionProgress.style.width =
                    "100%";


                updateSlideLocation();


                return;
            }


            updateSlideLocation();


            if (
                isPlaying
            ) {

                scheduleCurrentSlide();
            }
        }


        function nextSlide() {

            if (
                currentIndex <
                slides.length -
                1
            ) {

                trackTelemetry(
                    "presentation_next",
                    {
                        navigation_method:
                            "manual_next"
                    }
                );


                showSlide(
                    currentIndex +
                    1,
                    "manual_next"
                );
            }
        }


        function previousSlide() {

            if (
                currentIndex >
                0
            ) {

                trackTelemetry(
                    "presentation_previous",
                    {
                        navigation_method:
                            "manual_previous"
                    }
                );


                showSlide(
                    currentIndex -
                    1,
                    "manual_previous"
                );
            }
        }


        function togglePlayback() {

            const currentSlide =
                slides[
                currentIndex
                ];


            if (
                currentSlide &&
                currentSlide.dataset.indefinite ===
                "true"
            ) {

                return;
            }


            isPlaying =
                !isPlaying;


            setPlaybackButtonState();


            updateSlideLocation();


            if (
                isPlaying
            ) {

                trackTelemetry(
                    "presentation_resume",
                    {
                        resume_method:
                            "control"
                    }
                );


                scheduleCurrentSlide();

            } else {

                stopPlaybackTimers();


                trackTelemetry(
                    "presentation_pause",
                    {
                        pause_method:
                            "control"
                    }
                );
            }
        }


        /*
          ==========================================================
          SOURCE EDITOR
          ==========================================================
        */


        function closeEditor() {

            sourceEditorPanel.classList.remove(
                "visible"
            );


            if (
                isPlaying
            ) {

                scheduleCurrentSlide();
            }
        }


        function applySourceChanges() {

            sourceEditorPanel.classList.remove(
                "visible"
            );


            rebuildPresentation(
                false
            );
        }


        /*
          ==========================================================
          CONTROLS
          ==========================================================
        */


        previousButton.addEventListener(
            "click",
            previousSlide
        );


        nextButton.addEventListener(
            "click",
            nextSlide
        );


        playButton.addEventListener(
            "click",
            togglePlayback
        );


        playbackSpeed.addEventListener(
            "input",
            () => {

                const previousSpeed =
                    CONFIG.playbackSpeed;


                CONFIG.playbackSpeed =
                    Number(
                        playbackSpeed.value
                    );


                syncPlaybackSpeedControl();


                trackTelemetry(
                    "presentation_speed_changed",
                    {
                        playback_speed:
                            CONFIG.playbackSpeed,

                        previous_playback_speed:
                            previousSpeed
                    }
                );


                if (
                    isPlaying
                ) {

                    scheduleCurrentSlide();
                }
            }
        );


        slideScrubber.addEventListener(
            "input",
            () => {

                pausePlayback(
                    "scrubber"
                );


                trackTelemetry(
                    "presentation_scrub",
                    {
                        navigation_method:
                            "manual_scrub"
                    }
                );


                showSlide(
                    Number(
                        slideScrubber.value
                    ) -
                    1,
                    "manual_scrub"
                );
            }
        );


        closeEditorButton.addEventListener(
            "click",
            closeEditor
        );


        applySourceButton.addEventListener(
            "click",
            applySourceChanges
        );


        document.addEventListener(
            "click",
            event => {

                if (
                    !(event.target instanceof
                        Element)
                ) {

                    return;
                }


                const cta =
                    event.target.closest(
                        "#floatingApplicationButton, .finalQrButton"
                    );


                if (
                    !cta
                ) {

                    return;
                }


                trackTelemetry(
                    "cta_click",
                    {
                        cta_channel:
                            "button",

                        cta_placement:
                            cta.id ===
                                "floatingApplicationButton"
                                ? "floating_application"
                                : "final_application"
                    }
                );
            }
        );


        document.addEventListener(
            "keydown",
            event => {

                if (
                    sourceEditorPanel.classList.contains(
                        "visible"
                    )
                ) {

                    if (
                        event.key ===
                        "Escape"
                    ) {

                        closeEditor();
                    }


                    return;
                }


                if (
                    event.target instanceof
                    HTMLInputElement ||
                    event.target instanceof
                    HTMLTextAreaElement ||
                    event.target instanceof
                    HTMLButtonElement
                ) {

                    return;
                }


                if (
                    event.key ===
                    "ArrowRight"
                ) {

                    nextSlide();
                }


                if (
                    event.key ===
                    "ArrowLeft"
                ) {

                    previousSlide();
                }


                if (
                    event.key ===
                    " "
                ) {

                    event.preventDefault();

                    togglePlayback();
                }
            }
        );


        function restoreSlideFromLocation() {

            const requestedIndex =
                getSlideIndexFromLocation();


            if (
                requestedIndex ===
                currentIndex
            ) {

                updateSlideLocation();


                return;
            }


            pausePlayback(
                "url_restore"
            );


            showSlide(
                requestedIndex,
                "url_restore"
            );
        }


        window.addEventListener(
            "hashchange",
            restoreSlideFromLocation
        );


        window.addEventListener(
            "popstate",
            restoreSlideFromLocation
        );


        document.addEventListener(
            "visibilitychange",
            () => {

                if (
                    document.hidden
                ) {

                    flushActiveSlideClock();


                    trackTelemetry(
                        "presentation_hidden"
                    );


                    pausePlayback(
                        "visibility"
                    );

                } else {

                    activeSlideClockStartedAt =
                        activeSlideIndex >=
                            0
                            ? performance.now()
                            : 0;


                    trackTelemetry(
                        "presentation_visible"
                    );
                }
            }
        );


        window.addEventListener(
            "pagehide",
            () => {

                trackSlideExit(
                    currentIndex,
                    "pagehide"
                );


                trackTelemetry(
                    "presentation_session_exit",
                    {
                        exit_reason:
                            "pagehide"
                    }
                );
            }
        );


        window.addEventListener(
            "online",
            () => {

                trackTelemetry(
                    "presentation_connection_restored"
                );
            }
        );


        window.addEventListener(
            "offline",
            () => {

                trackTelemetry(
                    "presentation_connection_lost"
                );
            }
        );


        /*
          ==========================================================
          TOUCH / SWIPE
          ==========================================================
        */


        let touchStartX =
            0;


        let touchStartY =
            0;


        document.addEventListener(
            "touchstart",
            event => {

                if (
                    sourceEditorPanel.classList.contains(
                        "visible"
                    )
                ) {

                    return;
                }


                const touch =
                    event.changedTouches[
                    0
                    ];


                touchStartX =
                    touch.clientX;


                touchStartY =
                    touch.clientY;
            },
            {
                passive:
                    true
            }
        );


        document.addEventListener(
            "touchend",
            event => {

                if (
                    sourceEditorPanel.classList.contains(
                        "visible"
                    )
                ) {

                    return;
                }


                const touch =
                    event.changedTouches[
                    0
                    ];


                const deltaX =
                    touch.clientX -
                    touchStartX;


                const deltaY =
                    touch.clientY -
                    touchStartY;


                if (
                    Math.abs(
                        deltaX
                    ) <
                    45
                ) {

                    return;
                }


                if (
                    Math.abs(
                        deltaX
                    ) <
                    Math.abs(
                        deltaY
                    )
                ) {

                    return;
                }


                if (
                    deltaX <
                    0
                ) {

                    nextSlide();

                } else {

                    previousSlide();
                }
            },
            {
                passive:
                    true
            }
        );


        /*
          ==========================================================
          RESIZE
          ==========================================================
        */


        let resizeTimer =
            null;


        window.addEventListener(
            "resize",
            () => {

                clearTimeout(
                    resizeTimer
                );


                resizeTimer =
                    setTimeout(
                        () => {

                            fitCurrentSlide();


                            trackTelemetry(
                                "presentation_viewport_change"
                            );
                        },
                        100
                    );
            }
        );


        window.addEventListener(
            "orientationchange",
            () => {

                setTimeout(
                    () => {

                        fitCurrentSlide();


                        trackTelemetry(
                            "presentation_viewport_change"
                        );
                    },
                    220
                );
            }
        );


        /*
          ==========================================================
          INITIALIZE
          ==========================================================
        */


        initializeTelemetry();


        rebuildPresentation(
            false
        );


        /*
          Public hooks for future integrations.
        */

        window.presentationConfig =
            CONFIG;


        window.presentationSource =
            sourceTextarea;


        window.rebuildPresentation =
            rebuildPresentation;


        window.parsePresentationSource =
            parsePresentationSource;


        window.renderInlineFormatting =
            renderInlineFormatting;


        window.countSyllables =
            countSyllables;


        window.getPresentationSlideTimings =
            () =>
                slides.map(
                    slide =>
                        getSlideTiming(
                            slide
                        )
                );


        window.PresentationTelemetry =
        {
            track:
                trackTelemetry,

            updateConsent:
                updateTelemetryConsent,

            getConsent:
                () =>
                (
                    {
                        ...telemetryConsent
                    }
                ),

            getLocalEventLog:
                () =>
                    [
                        ...localTelemetryEvents
                    ]
        };

    </script>

</body>

</html>
